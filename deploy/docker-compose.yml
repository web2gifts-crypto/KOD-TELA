services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 400m
    # порт наружу не публикуется — доступ только через Caddy
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # воркер: напоминания, удаление неактивных аккаунтов. Тот же образ, что у api
  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    env_file: .env
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 200m
    depends_on:
      api:
        condition: service_healthy  # api применяет миграции при старте
    healthcheck:
      # сердцебиение обновляется каждые 30 с
      test: ["CMD", "python", "-c", "import time,sys; sys.exit(0 if time.time()-int(open('/tmp/worker-heartbeat').read())<120 else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
